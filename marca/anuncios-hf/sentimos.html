<!doctype html>
<!-- Anuncio «Lo sentimos» (formato 10 de biblioteca/formatos-anuncio.json). 9:16, 8 s, sin música. -->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/datos.js"></script>
    <link rel="stylesheet" href="assets/comun.css" />
    <style>
      .frase { position: absolute; left: 80px; right: 80px; top: 640px; text-align: center; font: 400 112px/1.05 var(--serif); }
      .frase em { font-style: italic; }
      #foto { background: url("assets/img/reloj-lune-puesto.jpg") center 30% / cover; opacity: 0; }
      #velo { background: linear-gradient(180deg, rgba(22,32,27,.58) 0%, rgba(22,32,27,.38) 30%, rgba(22,32,27,0) 46%, rgba(22,32,27,0) 100%); opacity: 0; }
      #logo { position: absolute; top: 290px; left: 0; right: 0; width: 360px; margin: 0 auto; opacity: 0; }
      #texto-foto { position: absolute; left: 70px; right: 70px; top: 390px; text-align: center; color: #fff; }
      #texto-foto h2 { font: 400 84px/1.05 var(--serif); opacity: 0; }
      #texto-foto h2 em { font-style: italic; }
      #texto-foto p { font: 400 36px/1.4 var(--sans); margin-top: 26px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div class="capa clip" data-start="0" data-duration="8">
        <div id="f1" class="frase">Lo sentimos,<br /><em>mamá.</em></div>
        <div id="f2" class="frase" style="opacity: 0">Este año<br /><em>no es colonia.</em></div>
      </div>
      <div id="foto" class="capa clip" data-start="0" data-duration="8"></div>
      <div id="velo" class="capa clip" data-start="0" data-duration="8"></div>
      <div class="capa clip" data-start="0" data-duration="8">
        <img id="logo" src="assets/img/logo-blanco.svg" alt="Lunerie" />
        <div id="texto-foto">
          <h2>Reloj Lune<br /><em data-precio="reloj-lune"></em></h2>
          <p>Por Black Friday, la 2.ª pieza al 50 %<br />y la 3.ª, gratis. Hasta el 5 de diciembre.</p>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll("[data-precio]").forEach((e) => (e.textContent = window.LU.precios[e.dataset.precio]));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f1", { opacity: 1 }, { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 1.7);
      tl.fromTo("#f2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.0);
      tl.to("#f2", { opacity: 0, duration: 0.3 }, 3.6);
      tl.fromTo("#foto", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1.0, duration: 1.0, ease: "power2.out" }, 3.6);
      tl.to("#foto", { scale: 1.04, duration: 3.4, ease: "none" }, 4.6);
      tl.fromTo("#velo", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 4.0);
      tl.fromTo("#texto-foto h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.4);
      tl.fromTo("#texto-foto p", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.0);
      tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 5.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
